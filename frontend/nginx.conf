# nginx do frontend Esporte+ — SPA React Router (todas as rotas caem no index.html)
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Cabeçalhos de segurança (em produção, na Vercel, ficam em vercel.json).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache longo para assets versionados (Vite gera hashes no nome)
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header aqui anula os do server: repete o essencial para os assets.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Fallback do SPA: /login, /admin, /perfil etc. servem o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
