# nginx do frontend Esporte+ — SPA React Router (todas as rotas caem no index.html)
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Cache longo para assets versionados (Vite gera hashes no nome)
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback do SPA: /login, /admin, /perfil etc. servem o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
